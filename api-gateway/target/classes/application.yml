server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    # ---- Consul service registry & discovery ----
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        prefer-ip-address: true
        service-name: ${spring.application.name}
        health-check-path: /actuator/health
        health-check-interval: 10s
    gateway:
      discovery:
        locator:
          # Disabled in favour of explicit routes below for predictable paths.
          enabled: false
      # Global CORS so the React frontend (CRA on http://localhost:3000) can call the gateway.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # ---- Customer Service (auth + profile) ----
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/customer-api/**

        # ---- Product Service ----
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/product-api/**

        # ---- Cart Service ----
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/cart-api/**

        # ---- Order Service ----
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order-api/**

        # ---- Payment Service ----
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payment-api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
