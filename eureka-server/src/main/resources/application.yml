server:
  port: 8761

spring:
  application:
    name: eureka-server

# A standalone registry does not register with itself or fetch the registry.
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Disable self-preservation in local/dev so dead instances are evicted quickly.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 15000

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
