# =====================================================================
# cart-service — example configuration
# =====================================================================
server:
  port: 8083

spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:mysql://<DB_HOST>:3306/ekart_cart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: <DB_USERNAME>
    password: <DB_PASSWORD>
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  cloud:
    consul:
      host: <CONSUL_HOST>             # e.g. localhost
      port: 8500
      discovery:
        register: true
        prefer-ip-address: true
        service-name: ${spring.application.name}
        health-check-path: /actuator/health
        health-check-interval: 10s
