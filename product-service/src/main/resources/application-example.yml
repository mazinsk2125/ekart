# =====================================================================
# product-service — example configuration
# Copy to application.yml and fill in real values.
# =====================================================================
server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://<DB_HOST>:3306/ekart_product?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: <DB_USERNAME>
    password: <DB_PASSWORD>
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://<EUREKA_HOST>:8761/eureka/
  instance:
    prefer-ip-address: true
