# =====================================================================
# log4j2 configuration (order-service)
# =====================================================================
name = order-service-log4j2
status = warn

# Console appender
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %logger{36} - %msg%n

# Rolling file appender
appender.file.type = RollingFile
appender.file.name = RollingFile
appender.file.fileName = logs/order-service.log
appender.file.filePattern = logs/order-service-%d{yyyy-MM-dd}-%i.log.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %logger{36} - %msg%n
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 5

# Application logger
logger.app.name = com.ekart
logger.app.level = info
logger.app.additivity = false
logger.app.appenderRef.console.ref = Console
logger.app.appenderRef.file.ref = RollingFile

# AOP logging aspect at debug to capture request/response detail
logger.aspect.name = com.ekart.order.utility.LoggingAspect
logger.aspect.level = debug
logger.aspect.additivity = false
logger.aspect.appenderRef.console.ref = Console
logger.aspect.appenderRef.file.ref = RollingFile

# Root logger
rootLogger.level = info
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = RollingFile
